# `adoc upgrade` (autoactualización) y el aviso de versión nueva de
# `adoc doctor`. Claves: cli.upgrade.*. Mantener las mismas claves y
# marcadores que en locales/en/upgrade.toml.

[cli.upgrade]
checking = "Consultando la última versión publicada…"
json_needs_check = "--format json solo es válido con --check"
insecure_url = "la URL de descarga debe usar https (http solo para localhost/127.0.0.1): {url}"
network = "no se pudo descargar {url}: {error}"
http_status = "no se pudo descargar {url}: HTTP {status}"
too_large = "{url} supera el límite de tamaño ({limit})"
invalid_manifest = "latest.json no válido en {url}"
invalid_version = "latest.json no tiene una versión válida: {version}"
update_available = "Hay una versión nueva: {current} → {latest}"
update_hint = "Actualiza con: adoc upgrade"
up_to_date = "adoc {current} está al día (última publicada: {latest})."
unsupported_musl = "este adoc se compiló para {target}: no hay binarios precompilados para musl (necesitan glibc). Compila desde el código: cargo install --git {repo} archeology-cli --force"
unsupported_target = "no hay binarios precompilados para {target}. Compila desde el código: cargo install --git {repo} archeology-cli --force"
homebrew = "adoc lo gestiona Homebrew ({path}): no se sustituye. Actualízalo con: brew upgrade archeology-doc"
cargo_managed = """adoc se instaló con cargo ({path}): no se sustituye. Actualízalo con:
  cargo install --git {repo} archeology-cli --force
  (desde un clon: cargo install --path crates/archeology-cli --force)"""
not_ours = "{path} no es un binario de archeology-doc (es un enlace a otro programa): no se sustituye. Reinstala con: {installer}"
not_in_release = "la versión {version} no incluye {file}"
plan_upgrade = "Actualizar adoc {current} → {latest}"
plan_reinstall = "Reinstalar adoc {latest}"
plan_dir = "Binarios en {dir}"
plan_link = "({link} es un enlace a {target})"
confirm = "¿Actualizar ahora?"
needs_yes = "se requiere confirmación: ejecuta `adoc upgrade --yes` en modo no interactivo (o `adoc upgrade --check` para solo consultar)"
cancelled = "Cancelado: no se cambió nada."
not_writable = "no se puede escribir en {dir} ({error}). Corrige los permisos de la carpeta o reinstala con el instalador: {installer}"
downloading = "Descargando {file}…"
sums_missing = "{file} no aparece en SHA256SUMS: no se instala (no se cambió nada)"
sums_disagree = "latest.json y SHA256SUMS no coinciden en el SHA-256 de {file}: no se instala (no se cambió nada)"
sha_mismatch = "el SHA-256 de {file} no coincide: descarga dañada o alterada (no se cambió nada)"
sha_ok = "✓ SHA-256 verificado ({file})"
archive_invalid = "no se pudo leer {file}: {error}"
unsafe_entry = "{file} contiene una ruta peligrosa ({entry}): no se instala (no se cambió nada)"
binary_missing = "{file} no contiene {entry}"
write_failed = "no se pudo escribir {path}"
staged_broken = "el binario descargado no se ejecuta en esta máquina ({error}): no se cambió nada"
replace_failed = "no se pudo sustituir {path}"
done = "✓ Actualizado: {version}"
verify_failed = "el binario nuevo no responde a --version ({error}); reinstala con: {installer}"
vscode_no_code = "falta el comando `code`: no se actualizó la extensión de VS Code (VS Code → Shell Command: Install 'code' command in PATH)"
vscode_ok = "✓ Extensión de VS Code actualizada"
vscode_failed = "no se pudo actualizar la extensión de VS Code: {error}"
notice_available = "{latest} disponible (actual {current})"
notice_up_to_date = "al día (última publicada: {latest})"
