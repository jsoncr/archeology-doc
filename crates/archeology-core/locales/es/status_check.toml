# Salida de texto de `adoc status` (resumen del proyecto) y `adoc check`
# (lista de comprobación), en el idioma de la interfaz. Claves: cli.status.*
# y cli.check.*. Mantener las mismas claves y marcadores que en
# locales/en/status_check.toml. Las antigüedades ({age}) son compactas:
# 40s, 5m, 3h, 2d, 4mo, 1y.

[cli.status]
not_initialized = "archeology-doc no está inicializado en este directorio (no hay archeology-doc.toml)."
profile_unknown = "desconocido"
doc_language = "docs: {lang}"
plan_profile = "plan: {profile}"
not_scanned = "sin escanear todavía"
files = "{count} archivos"
lines_of_code = "{count} líneas de código"
more = "+{count} más"
commits = "{count} commits"
commit_one = "1 commit"
last_commit = "último hace {age}"
git_clean = "sin cambios"
git_changes = "{count} cambios sin confirmar"
notes = "{count} notas"
stale = "{count} obsoletas"
missing = "no existe"
site_synced = "sitio VitePress · sincronizado hace {age}"
site_not_synced = "sitio VitePress, sin sincronizar"
docs_no_site = "presente (sin sitio VitePress)"
specs = "{count} specs"
requirements = "{count} requisitos"
changes = "{count} cambios activos"
progress = "{done}/{total} tareas · {pct}%"
failed = "{count} fallidas"
blocked_by = "espera a {ids}"
questions_open = "{count} abiertas"
findings_open = "{count} abiertos"
model = "modelo {model}"
default_model = "modelo por defecto"

[cli.status.section]
project = "Proyecto"
structure = "Estructura generada"
progress = "Progreso"
pending = "Tareas pendientes ({count})"
attention = "Requiere atención"
agent = "Agente"
next = "Siguiente paso"

[cli.status.label]
root = "Raíz"
inventory = "Inventario"
type = "Tipo"
languages = "Lenguajes"
size = "Tamaño"
modules = "Módulos"
context = "Contexto"
questions = "Preguntas"
findings = "Hallazgos"

[cli.status.kind]
service = "Servicio {runtime}"
web = "Aplicación web {runtime}"
desktop = "Aplicación de escritorio {runtime}"
cli = "CLI {runtime}"
project = "Proyecto {runtime}"
unknown = "proyecto sin código detectado"

[cli.status.note_type]
overview = "overview"
module = "módulos"
feature = "funcionalidades"
finding = "hallazgos"
test-report = "tests"
spec-report = "specs"
glossary = "glosario"
decision = "decisiones"
memory = "memoria"
faq = "FAQ"

[cli.status.next]
scan = "inventariar el repositorio (sin IA)"
plan = "generar las tareas de inspección"
answer = "el agente espera tu respuesta"
resume = "reintentar {count} tareas fallidas"
inspect = "quedan {count} tareas para el agente"
manual = "{count} tareas exportadas en modo manual"
sync = "{count} notas obsoletas: detectar cambios y reabrir sus tareas"
site_sync = "todo documentado: actualiza el sitio"
preview = "todo documentado: revisa el resultado"

[cli.check]
running = "Validando notas, evidencias y enlaces…"
title = "adoc check"
more = "+{count} más"
config_ok = "{file} es válido"
inventory_ok = "{files} archivos · escaneado hace {age}"
inventory_missing = "sin inventario (vive en ~/.archeology-doc, no en el repositorio)"
tasks_ok = "{total} tareas · {done} hechas"
tasks_need_scan = "requiere el inventario primero"
tasks_missing = "todavía no hay tareas planificadas"
overview_missing = "no existe knowledge/00-overview.md"
overview_template = "solo la plantilla: el agente aún no escribió el overview"
overview_ok = "escrito por el agente"
frontmatter_ok = "{count} notas, todas válidas"
frontmatter_bad = "{count} notas · {bad} con problemas"
evidence_ok = "{count} evidencias citadas, todas válidas"
evidence_bad = "{count} evidencias citadas · {bad} problemas"
wikilinks_ok = "{count} enlaces, todos resuelven"
wikilinks_bad = "{count} enlaces · {broken} rotos"
duplicates_ok = "sin IDs repetidos ni hallazgos equivalentes"
duplicates_bad = "{count} duplicados"
stale_ok = "ninguna"
stale_bad = "{count} notas desactualizadas por cambios en el código"
agents_ok = "regiones gestionadas al día"
agents_outdated = "regiones gestionadas desactualizadas"
agents_no_region = "existe, sin regiones gestionadas de archeology-doc"
agents_missing = "no existe"
site_built = "el sitio VitePress compila"
site_build_failed_short = "el sitio VitePress no compila"
site_ok = "generado · sincronizado hace {age}"
site_not_synced = "opcional: VitePress configurado, sin sincronizar"
site_none = "opcional: sin sitio VitePress"
openspec_none = "no detectado"
openspec_ok = "{specs} specs · {requirements} requisitos · {changes} cambios activos"
openspec_stale_change = "sin actividad hace {days} días (posiblemente abandonado)"
sum_ok = "{count} ok"
sum_warnings = "{count} advertencias"
sum_errors = "{count} errores"
sum_skipped = "{count} omitidas"
strict_note = "--strict: las advertencias de validación también fallan."

[cli.check.group]
setup = "Configuración y estado"
knowledge = "Conocimiento"
outputs = "Contexto y sitio"

[cli.check.name]
config = "Configuración"
inventory = "Inventario"
tasks = "Tareas"
overview = "Overview"
frontmatter = "Frontmatter"
evidence = "Evidencias"
wikilinks = "Wikilinks"
duplicates = "Duplicados"
stale = "Notas obsoletas"
agents_md = "AGENTS.md"
site = "Sitio"
openspec = "OpenSpec"

[cli.check.hint]
frontmatter = "corrige las notas listadas (referencia: knowledge/_templates/)"
evidence = "corrige `sources:` (archivo existente dentro del proyecto, rango de líneas válido)"
wikilinks = "crea la nota destino o corrige el enlace"
duplicates = "usa un id único por nota; fusiona los hallazgos equivalentes"
site_build = "ejecuta `adoc site build` para ver el error completo"
openspec = "revisa el cambio (proposal.md, tasks.md, specs/) o archívalo"
