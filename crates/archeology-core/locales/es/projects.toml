# Mensajes de `adoc init` (duplicados) y `adoc projects delete` (idioma de
# la interfaz). Mismas claves y marcadores que locales/en/projects.toml.

[projects.init]
already_initialized = "{path} ya está inicializado: {name} ({id})\n  → `adoc status` para ver su estado; `adoc init --force` para reinicializarlo (conserva el ID)"
already_initialized_unreadable = "{path} ya tiene archeology-doc.toml, pero no se puede leer: {error}\n  → corrígelo, o `adoc init --force` para sobrescribirlo"
registered_at_path = "{path} ya está registrado como {name} ({id}), pero no tiene archeology-doc.toml\n  → `adoc init --force` para reinicializarlo con el mismo ID, o `adoc projects delete {id}` para olvidarlo"
name_conflict = "ya hay otro proyecto registrado como '{name}' en {path} ({id})\n  → elige otro nombre: `adoc init --name <otro>`"
name_conflict_gone = "ya hay otro proyecto registrado como '{name}' en {path} ({id}), y esa carpeta ya no existe\n  → `adoc projects delete {id}` para olvidarlo, o `adoc init --name <otro>`"
same_id_elsewhere = "! el ID de este proyecto ({id}) también está registrado para {path} (¿carpeta copiada o clon?). Ambos compartirían estado, tareas y ejecuciones.\n  → `adoc init --new-id` para darle a esta carpeta su propio ID"
registered_now = "registrado en el registro global"
new_id = "✓ {name}: ID nuevo {new} (anterior: {old}). El espacio de trabajo anterior sigue siendo del proyecto original."

[projects.delete]
not_found = "ningún proyecto registrado coincide con '{query}' (`adoc projects list`)"
title = "Eliminar proyecto"
path_missing = "(carpeta no encontrada)"
will_remove = "Se eliminará:"
registry_entry = "entrada del registro"
workspace = "espacio de trabajo (estado, tareas, ejecuciones)"
no_workspace = "(sin espacio de trabajo)"
approvals = "{count} aprobación(es) (adaptadores, sitio)"
project_files = "Archivos del proyecto (-d):"
nothing_generated = "(no se encontraron archivos generados)"
strip_regions = "solo las regiones gestionadas; tu texto se conserva"
files_count = "{count} archivo(s)"
knowledge_warning = "knowledge/ puede tener notas que editaste a mano"
docs_from_init = "creado por `adoc init`, sin páginas tuyas"
docs_user_pages = "{path} tiene {count} archivo(s) tuyos: solo se borra lo generado"
docs_not_ours = "{path} no lo creó adoc: solo se borran sus carpetas generadas"
kept = "Se conserva:"
kept_unbalanced = "{path}: marcadores de región dañados; no se toca"
files_skipped_missing = "la carpeta del proyecto ya no existe: no hay archivos que borrar"
files_skipped_other_id = "la carpeta ahora contiene otro proyecto ({id}): sus archivos no se tocan"
files_skipped_unreadable = "no se puede leer archeology-doc.toml ({error}): los archivos del proyecto no se tocan"
files_kept_hint = "Los archivos del proyecto (archeology-doc.toml, knowledge/, AGENTS.md, docs/…) se conservan; añade -d para borrar lo que generó adoc."
confirm = "¿Eliminar?"
cancelled = "cancelado"
unsafe = "{path} cambió (symlink o fuera del proyecto); se detiene"
done = "proyecto {name} ({id}) eliminado"
