# Mensajes de interfaz de los comandos de trabajo de archeology-cli (idioma
# de la interfaz): task, agent, inspect, resume, ask, sync, plan, check y
# las utilidades comunes.
# Claves: cli.<comando>.<mensaje>. Marcadores: {nombre}. Uso: `t!(...)`.
# Mantener las mismas claves y marcadores en locales/en/cli_work.toml.

[cli.commands]
project_not_in_registry = "proyecto '{name}' no está en el registro global"
registry_update_failed = "no se pudo actualizar el registro global: {error}"
confirm_required = "operación requiere confirmación; usa --yes en modo no interactivo"
confirm_suffix = "[s/N]"
adapter_undefined = "adaptador '{agent}' no definido"
yes = "sí"
no = "no"

[cli.plan]
