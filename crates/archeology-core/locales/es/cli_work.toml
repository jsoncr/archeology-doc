not_merged = "el plan actual tiene {existing} tareas y el nuevo tendría {new}: no se mezclan."
replace_hint = "Para reemplazarlo: `adoc plan --force` (las tareas sin cambios conservan su estado)."
summary = "plan: {total} tareas ({written} escritas, {kept} conservan su estado, {removed} eliminadas) en {path}"
next_step = "Siguiente paso: `adoc inspect` o `adoc task list`."

