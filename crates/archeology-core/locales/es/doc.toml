overview = "Resumen"
status = "Estado"
findings = "Hallazgos"
questions = "Preguntas y FAQ"
knowledge_base = "Base de conocimiento"
specifications = "Especificaciones"
generated_mark = "Carpeta generada por archeology-doc: se borra y regenera en cada `site sync`."

[doc.site.section]
