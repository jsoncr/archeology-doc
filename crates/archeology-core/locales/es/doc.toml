# Contenido generado (idioma de la documentación del proyecto: `[project] language`).
# Claves: doc.<área>.<texto>. Marcadores: {nombre}. Usar con `tl!(project.doc_lang(), ...)`.
# Mantener las mismas claves y marcadores en locales/en/doc.toml.

[doc.agents]
default_intro = "Contexto para agentes de IA."
project_heading = "## Proyecto (inventario de archeology-doc)"
commands_heading = "### Comandos"
no_commands = "- (no se detectaron comandos de build/test; documéntalos aquí fuera de la región)"
entrypoints_heading = "### Puntos de entrada"
modules_heading = "### Módulos"
module_item = "- `{path}` ({files} archivos) — `{note}`"
sensitive_heading = "### Zonas sensibles"
secrets_rule = "- Nunca leas ni cites archivos de secretos: {patterns}."
openspec_rule = "- `{spec}/specs/` es normativo y de solo lectura; propone cambios en `{spec}/changes/`."
ci_rule = "- CI definido en: {files}."

[doc.adapters]
pointer = "Las instrucciones de este proyecto viven en `AGENTS.md` (contexto, comandos, memoria y reglas). Léelo completo antes de trabajar; no dupliques aquí su contenido."
cursor_description = "Contexto del proyecto (archeology-doc)"

[doc.skills]
memory_description = "Cómo leer y actualizar la memoria del proyecto (hechos, convenciones, decisiones y sesiones)."
memory_body = """
1. Al empezar, lee `{know}/memory/facts.md`, `conventions.md`, `decisions.md` y `open-questions.md`.
2. Al terminar, crea `{know}/memory/sessions/<AAAA-MM-DD>-<tema>.md` con la plantilla `{know}/_templates/session.md`.
3. Promueve a la memoria estable solo lo verificado, con el formato `- AAAA-MM-DD · afirmación · fuente: ruta:línea`.
4. Si algo contradice la memoria, regístralo en `open-questions.md` en vez de sobrescribir la entrada."""
tests_description = "Cómo compilar, ejecutar los tests y el linter de este proyecto."
tests_intro = "Comandos detectados en los manifiestos del proyecto:"
tests_advice = "Ejecuta primero el build, luego los tests. Si un test falla, cita el archivo y la línea del fallo en lugar de resumirlo."

