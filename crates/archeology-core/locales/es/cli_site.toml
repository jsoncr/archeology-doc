# Baseline inferido de OpenSpec (`adoc spec baseline`, idioma del proyecto).
# `## Why` y `## What Changes` son encabezados de OpenSpec: no se traducen.
[doc.spec_baseline]
title = "Baseline inferido"
why = "El proyecto no tiene especificaciones para estas áreas. archeology-doc propone requisitos base inferidos del código por ingeniería inversa. Son **inferidos**: describen lo que el código hace, no una intención de negocio verificada, y deben revisarse antes de archivar el cambio."
what_item = "- Agrega requisitos inferidos para `{name}`."
tasks = """
## 1. Revisión humana

- [ ] 1.1 Revisar cada requisito inferido contra la intención de negocio
- [ ] 1.2 Completar escenarios faltantes
- [ ] 1.3 Validar con `openspec validate <cambio> --strict`
- [ ] 1.4 Archivar el cambio con `openspec archive`
"""
objective = "Inferir specs base en formato OpenSpec para: {names}. Por cada capability escribe {change}/specs/<capability>/spec.md con `## ADDED Requirements`; cada requisito es `### Requirement: <título>` con una frase SHALL/MUST, una línea `> Inferido por archeology-doc · confianza: high|medium|low · evidencia: ruta:línea` y al menos un `#### Scenario:` con viñetas **WHEN**/**THEN**. Describe solo comportamiento verificable en el código; no afirmes intención de negocio (RF-158). No toques openspec/specs/."

