# `adoc upgrade` (self-update) and the update notice of `adoc doctor`.
# Keys: cli.upgrade.*. Keep the same keys and placeholders as
# locales/es/upgrade.toml.

[cli.upgrade]
checking = "Checking the latest published version…"
json_needs_check = "--format json is only valid with --check"
insecure_url = "the download URL must use https (plain http only for localhost/127.0.0.1): {url}"
network = "could not download {url}: {error}"
http_status = "could not download {url}: HTTP {status}"
too_large = "{url} exceeds the size limit ({limit})"
invalid_manifest = "invalid latest.json at {url}"
invalid_version = "latest.json does not contain a valid version: {version}"
update_available = "New version available: {current} → {latest}"
update_hint = "Update with: adoc upgrade"
up_to_date = "adoc {current} is up to date (latest published: {latest})."
unsupported_musl = "this adoc was built for {target}: there are no prebuilt binaries for musl (they require glibc). Build from source: cargo install --git {repo} archeology-cli --force"
unsupported_target = "there are no prebuilt binaries for {target}. Build from source: cargo install --git {repo} archeology-cli --force"
homebrew = "adoc is managed by Homebrew ({path}): it is not replaced. Update it with: brew upgrade archeology-doc"
cargo_managed = """adoc was installed with cargo ({path}): it is not replaced. Update it with:
  cargo install --git {repo} archeology-cli --force
  (from a clone: cargo install --path crates/archeology-cli --force)"""
not_ours = "{path} is not an archeology-doc binary (a link to another program): it is not replaced. Reinstall with: {installer}"
not_in_release = "release {version} does not include {file}"
plan_upgrade = "Update adoc {current} → {latest}"
plan_reinstall = "Reinstall adoc {latest}"
plan_dir = "Binaries in {dir}"
plan_link = "({link} is a link to {target})"
confirm = "Update now?"
needs_yes = "confirmation required: run `adoc upgrade --yes` in non-interactive mode (or `adoc upgrade --check` to only check)"
cancelled = "Cancelled: nothing was changed."
not_writable = "cannot write to {dir} ({error}). Fix the folder's permissions or reinstall with the installer: {installer}"
downloading = "Downloading {file}…"
sums_missing = "{file} is not listed in SHA256SUMS: refusing to install it (nothing was changed)"
sums_disagree = "latest.json and SHA256SUMS disagree on the SHA-256 of {file}: refusing to install it (nothing was changed)"
sha_mismatch = "SHA-256 of {file} does not match: corrupted or tampered download (nothing was changed)"
sha_ok = "✓ SHA-256 verified ({file})"
archive_invalid = "could not read {file}: {error}"
unsafe_entry = "{file} contains an unsafe path ({entry}): refusing to install it (nothing was changed)"
binary_missing = "{file} does not contain {entry}"
write_failed = "could not write {path}"
staged_broken = "the downloaded binary does not run on this machine ({error}): nothing was changed"
replace_failed = "could not replace {path}"
done = "✓ Updated: {version}"
verify_failed = "the new binary does not answer --version ({error}); reinstall with: {installer}"
vscode_no_code = "the `code` command is missing: the VS Code extension was not updated (VS Code → Shell Command: Install 'code' command in PATH)"
vscode_ok = "✓ VS Code extension updated"
vscode_failed = "could not update the VS Code extension: {error}"
notice_available = "{latest} available (current {current})"
notice_up_to_date = "up to date (latest published: {latest})"
