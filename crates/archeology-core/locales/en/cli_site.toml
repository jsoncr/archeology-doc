flat = "(flat structure)"

# Inferred OpenSpec baseline (`adoc spec baseline`, project language).
# `## Why` and `## What Changes` are OpenSpec headings: they are not translated.
[doc.spec_baseline]
title = "Inferred baseline"
why = "The project has no specifications for these areas. archeology-doc proposes baseline requirements inferred from the code by reverse engineering. They are **inferred**: they describe what the code does, not a verified business intent, and must be reviewed before archiving the change."
what_item = "- Adds inferred requirements for `{name}`."
tasks = """
## 1. Human review

- [ ] 1.1 Review each inferred requirement against the business intent
- [ ] 1.2 Complete the missing scenarios
- [ ] 1.3 Validate with `openspec validate <change> --strict`
- [ ] 1.4 Archive the change with `openspec archive`
"""
objective = "Infer baseline specs in OpenSpec format for: {names}. For each capability write {change}/specs/<capability>/spec.md with `## ADDED Requirements`; each requirement is `### Requirement: <title>` with a SHALL/MUST sentence, a line `> Inferred by archeology-doc · confidence: high|medium|low · evidence: path:line` and at least one `#### Scenario:` with **WHEN**/**THEN** bullets. Describe only behavior verifiable in the code; do not assert business intent (RF-158). Do not touch openspec/specs/."

