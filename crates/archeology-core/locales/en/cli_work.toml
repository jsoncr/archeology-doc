answering = "{agent} is answering…"
partial_kept = "; the partial note was left in {path} (it was not saved in {rel})"
interrupted = "{agent} interrupted{detail}"
no_response = "{agent} did not answer ({reason}); see {log}{detail}"
empty_response = "{agent} returned nothing; see {log}"
note_missing = "{path} does not exist"
saved = "saved in {path} (it shows up in the FAQ of `adoc preview`)"

[cli.sync]
comparing = "Comparing the sources cited by the notes…"
git_diff_failed = "could not run git diff against {reference}"
dry_run_banner = "DRY-RUN: nothing is modified (notes, tasks and state stay as they are)"
compared_hashes = "hashes saved by the last sync (or the first time each source was cited)"
compared_git = "git diff {reference} → working tree"
no_watched = "no note cites code yet: sync cannot tell which notes become outdated"
watched = "{files} files cited in {notes} notes"
notes_count = "{count} notes"
more = "+{count} more"
uncovered_hint = "not covered by any note → `adoc scan` updates the inventory and `adoc plan` adds tasks"
uncovered_unavailable = "not computed (needs git and a previous `adoc scan`)"
locked = "locked, left untouched: {note}"
no_changes = "No changes: the documentation is in sync with the code."
sum_changed = "{count} documented sources changed"
sum_stale = "{count} notes stale"
sum_reopened = "{count} tasks reopened"
sum_uncovered = "{count} changes outside the docs"
dry_run = "(dry-run: notes, tasks and state left unchanged)"

[cli.sync.label]
compared = "Compared against"
watched = "Watched sources"
uncovered = "Outside the docs"
reopened = "Tasks reopened"
next = "Next step"

[cli.sync.section]
changed = "Changes in documented sources ({count})"
uncovered = "Changes outside the documentation ({count})"
stale = "Notes marked stale ({count})"

[cli.sync.next]
scan = "no inventory yet"
scan_plan = "{count} changed files are not documented; then `adoc inspect`"
inspect = "re-document the stale notes (reopened tasks)"
no_watched = "let the agent write notes with evidence first"
nothing = "nothing to do"

# Generated content (project documentation language, `tl!`).
[doc.faq]
fallback_slug = "question"
