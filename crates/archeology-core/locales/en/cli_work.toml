# User-interface messages of the archeology-cli work commands (UI language):
# task, agent, inspect, resume, ask, sync, plan, check and the shared helpers.
# Keys: cli.<command>.<message>. Placeholders: {name}. Use with `t!(...)`.
# Keep the same keys and placeholders in locales/es/cli_work.toml.

[cli.commands]
project_not_in_registry = "project '{name}' is not in the global registry"
registry_update_failed = "could not update the global registry: {error}"
confirm_required = "this operation needs confirmation; use --yes in non-interactive mode"
confirm_suffix = "[y/N]"
adapter_undefined = "adapter '{agent}' is not defined"
yes = "yes"
no = "no"

[cli.plan]
no_inventory = "no inventory found; run `adoc scan` first"
profile_small = "small"
profile_medium = "medium"
profile_large = "large"
profile = "profile: {profile} ({files} code files, {modules} modules in {groups} groups) · adjust it with [plan] size = \"small|medium|large\""
not_merged = "the current plan has {existing} tasks and the new one would have {new}: they are not merged."
replace_hint = "To replace it: `adoc plan --force` (unchanged tasks keep their status)."
summary = "plan: {total} tasks ({written} written, {kept} kept their status, {removed} removed) in {path}"
next_step = "Next step: `adoc inspect` or `adoc task list`."

[cli.task]
invalid_id = "invalid task id: '{id}'"
no_tasks = "no tasks yet; run `adoc plan` first"
col_task = "task"
col_status = "status"
col_file = "file"
exported = "{count} tasks exported to {path} — run them with your agent and mark them with `adoc task done <id>`"
invalid_frontmatter = "invalid task frontmatter"
validation_failed = "the output of {id} fails validation ({count} errors); fix it or use --force"
marked_done = "task {id} marked as done"
not_question = "task {id} is in `{status}` and is not waiting for an answer (only tasks in `question` can be answered)"
answer_saved = "answer saved in {id}; retry with `adoc inspect` or `adoc task run {id}`"
adapter_undefined_in_config = "adapter '{agent}' is not defined in archeology-doc.toml"
invalid_agent_config = "invalid agent configuration:\n  - {problems}\n(check archeology-doc.toml or run `adoc doctor`)"
no_interactive = "'{agent}' has no interactive mode configured."
open_agent_hint = "Open your agent in {path} and give it the task:"
when_done_hint = "When you're done: adoc task done {id}"
pending_question = "Pending question from the agent: {question}"
opening = "Opening {agent} with task {id}. When you're done, exit the agent to validate the output.\n"
launch_failed = "could not launch '{command}'"
agent_exit_status = "warning: {agent} exited with {status}"
interactive_validation_failed = "\n✗ {id}: the output fails validation ({count} errors). Retry with `adoc task run {id} --interactive` or close it with `adoc task done {id} --force`."
completed = "\n✓ {id} completed"

[cli.agent]
model_not_found = """the model '{model}' doesn't exist in {agent}. Similar models:
{suggestions}
  → full list: {command}"""
model_check_skipped = "warning: couldn't verify the model (`{command}` failed or took too long); only its format was checked"
trust_revoked = "approval of '{name}' revoked"
not_trusted = "'{name}' was not approved in this project"
checking_agents = "Checking agents…"
col_agent = "agent"
col_mode = "mode"
col_available = "available"
col_model = "model"
col_detail = "detail"
builtin_detail = "{detail} · built-in (added by `adoc agent use {name}`)"
differs_detail = "{detail} · differs from the built-in one"
active = "\nactive: {name} · change it with `adoc agent use <agent> [--model <model>]`"
outdated = "{name} differs from the built-in definition; to use it: `adoc agent use {name} --reset`"
not_in_config = "{name}: not defined in the configuration"
no_trust_needed = "'{name}' is built-in or an export adapter: it needs no approval"
trust_header = "Adapter [agent.adapters.{name}] from {root}:"
command_none = "(none)"
model_default = "(agent default)"
trust_warning = "\nThis command will run on your machine with your permissions and your credentials."
trust_confirm = "Approve this adapter?"
not_approved = "not approved"
approved = "'{name}' approved for this project"
invalid_config_file = "invalid archeology-doc.toml"
not_builtin = "'{name}' is not a built-in agent; there is no definition to go back to"
unknown_agent = "unknown agent '{name}'; available: {available} (or define [agent.adapters.{name}])"
adapters_not_table = "[agent.adapters] is not a table"
adapter_reset = "restored the built-in adapter [agent.adapters.{name}]"
adapter_added = "added the built-in adapter [agent.adapters.{name}]"
checking_agent = "Checking {name}…"
tasks_reopened = "{count} tasks exported in manual mode are back to `pending` for {name}: run them with `adoc inspect`"
manual_not_reopened = "warning: tasks in manual mode were not reopened: {name} is not ready (approve or install it and run `adoc agent use {name}` again)"
model_suffix = " · model {model}"
active_agent = "active agent: {name}{model}"
export_mode = "export mode: `adoc inspect` will mark the tasks as manual; run them in {name} and close them with `adoc task done <id>`"

[cli.inspect]
preparing = "Preparing tasks for {agent}…"
attempt = " (attempt {attempt}/{attempts})"
working = "[{index}/{total}] {task} · {kind}{module} · {agent} working{retry}…"
dry_run = "dry-run (agent: {agent}): {count} tasks would run:"
run_header = "run {run} (agent: {agent})"
exported = "  exported (manual mode): {tasks} — complete them with your agent and use `task done <id>`"
manual_waiting = "  {count} tasks in manual mode (exported to be done by hand):"
manual_hint_done = "    · do them in that agent and close them with `adoc task done <id>` (see `adoc task show <id>`)"
manual_hint_resume = "    · or run them with {agent}: `adoc inspect --resume`"
manual_hint_switch = "    · or switch to an agent with a CLI: `adoc agent use claude` (it reopens them), then `adoc inspect`"
nothing_pending = "  no pending tasks"
blocked_summary = "  {count} tasks blocked by unfinished dependencies"
blocked = "  {id} blocked: waiting for {deps}"
log_suffix = " (log: {path})"
hint_failed = "failed in a previous run{log} — retry with `adoc inspect --resume`"
hint_running = "was interrupted — retry with `adoc inspect --resume`"
hint_manual = "is in manual mode — complete it and use `adoc task done {id}`"
hint_question = "is waiting for your answer — `adoc task answer {id} \"…\"`"
hint_pending = "is pending but outside the filter — run it with `adoc inspect --task {id}`"
hint_other = "status `{status}`"

[cli.resume]
project_not_registered = "project '{name}' is not registered"
resuming = "resuming {project} (agent: {agent})"
no_pending = "no projects with pending work"
pending_projects = "projects with pending work:"
pending_project = "  {name} ({count} tasks) — {path}"
which = "Which one do you want to resume?"
invalid_choice = "invalid choice"

[cli.ask]
prompt = "Question"
empty = "type the question: adoc ask \"…?\" (or just `adoc ask` and type it afterwards)"
