# Text output of `adoc status` (project snapshot) and `adoc check`
# (checklist), in the UI language. Keys: cli.status.* and cli.check.*.
# Keep the same keys and placeholders in locales/es/status_check.toml.
# Ages ({age}) are compact: 40s, 5m, 3h, 2d, 4mo, 1y.

[cli.status]
not_initialized = "archeology-doc is not initialized in this directory (no archeology-doc.toml)."
profile_unknown = "unknown"
doc_language = "docs: {lang}"
plan_profile = "plan: {profile}"
not_scanned = "not scanned yet"
files = "{count} files"
lines_of_code = "{count} lines of code"
more = "+{count} more"
commits = "{count} commits"
commit_one = "1 commit"
last_commit = "last {age} ago"
git_clean = "clean"
git_changes = "{count} uncommitted changes"
notes = "{count} notes"
stale = "{count} stale"
missing = "missing"
site_synced = "VitePress site · synced {age} ago"
site_not_synced = "VitePress site, not synced yet"
docs_no_site = "present (no VitePress site)"
specs = "{count} specs"
requirements = "{count} requirements"
changes = "{count} active changes"
progress = "{done}/{total} tasks · {pct}%"
failed = "{count} failed"
blocked_by = "waits for {ids}"
questions_open = "{count} open"
findings_open = "{count} open"
model = "model {model}"
default_model = "default model"

[cli.status.section]
project = "Project"
