# Publica una versión: compila los binarios de cada plataforma, arma
# WEBSITE/download (binarios, extensión, instaladores, SHA256SUMS y
# latest.json), crea el release en GitHub y despliega el sitio en Cloudflare Pages.
#
# Se dispara con un tag `v*` (git tag v0.2.0 && git push origin v0.2.0) o a mano.
# URL pública del sitio: https://archeology-doc.com, salvo que se defina la
# variable del repositorio SITE_URL. Los instaladores la usan para descargar
# los binarios.
#
# Cloudflare Pages necesita dos secrets del repositorio:
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta (panel de Cloudflare → Workers & Pages)
# y la variable opcional CLOUDFLARE_PAGES_PROJECT (por defecto `archeology-doc`).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # El tag (v0.2.0) debe coincidir con la versión del workspace en Cargo.toml;
  # si no, los binarios dirían una versión y el release otra.
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: tag = versión de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Primera línea `version = "..."` dentro de [workspace.package].
          crate="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$crate" ]; then
            echo "::error::no se encontró la versión en [workspace.package] de Cargo.toml"
            exit 1
          fi
          if [ "$tag" != "$crate" ]; then
            echo "::error::el tag $GITHUB_REF_NAME no coincide con la versión $crate de Cargo.toml"
            exit 1
          fi
          echo "versión $crate"

  # Linux (x86_64 y ARM64) y Windows con zig como linker cruzado
  # (cargo-zigbuild): Linux contra glibc 2.28, compatible con distros desde 2018.
  build-linux-windows:
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu
      - name: zig y cargo-zigbuild
        run: pip install ziglang==0.17.0 cargo-zigbuild==0.23.4
      - name: compilar y empaquetar
        run: >
          WEBSITE/dist.sh --native --skip-vsix --out dist
          --targets "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-windows
          path: dist/adoc-*
          if-no-files-found: error

  build-macos:
    needs: check-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: compilar y empaquetar
        run: >
          WEBSITE/dist.sh --native --skip-vsix --out dist
          --targets "aarch64-apple-darwin x86_64-apple-darwin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-macos
          path: dist/adoc-*
          if-no-files-found: error

  # Junta los binarios, empaqueta la extensión, aplica SITE_URL a los
  # instaladores y genera SHA256SUMS y latest.json.
  assemble:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: WEBSITE/download
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: extensión, instaladores y sumas
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://archeology-doc.com' }}
        run: WEBSITE/dist.sh --no-build --base-url "${SITE_URL%/}/download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: download
          path: WEBSITE/download
      # Solo el sitio estático: fuera dist.sh, scripts/ (comprobaciones), los README.md
      # e installers/ (que aún llevan el marcador __ADOC_DOWNLOAD_BASE__; los publicados
      # están en download/). i18n.js sí se publica (lo carga index.html).
      - name: preparar el sitio para Cloudflare Pages
        run: |
          rm -rf _site
          mkdir _site
          cp -R WEBSITE/. _site/
          rm -rf _site/dist.sh _site/README.md _site/installers _site/scripts _site/download/README.md
          test -f _site/i18n.js || { echo "::error::falta i18n.js en el sitio"; exit 1; }
          if grep -rlI '__ADOC_DOWNLOAD_BASE__' _site; then
            echo "::error::quedan marcadores __ADOC_DOWNLOAD_BASE__ sin reemplazar en el sitio"
            exit 1
          fi
          # Cloudflare Pages rechaza archivos de más de 25 MiB.
          big="$(find _site -type f -size +25M)"
          if [ -n "$big" ]; then
            echo "::error::archivos de más de 25 MiB (límite de Cloudflare Pages): $big"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: download
          path: download
      - name: crear el release con los archivos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" download/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  # wrangler con versión fija vía npx: sin actions de terceros con acceso al token.
  deploy-site:
    needs: assemble
    runs-on: ubuntu-22.04
    environment:
      name: cloudflare-pages
      url: ${{ vars.SITE_URL || 'https://archeology-doc.com' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: _site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: desplegar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'archeology-doc' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::faltan los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          # Rama de producción: así el despliegue va al dominio propio y no a una vista previa.
          npx --yes wrangler@4.141.0 pages deploy _site \
            --project-name "$PROJECT" --branch main --commit-dirty=true
